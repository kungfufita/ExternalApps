name: Deploy IEP Studio to GitHub Pages

# Publishes apps/deaf-teacher-iep by syncing it to the gh-pages branch,
# which GitHub Pages serves (classic branch-based Pages). The
# actions/deploy-pages route is not used because this repo's workflow
# token cannot create the Pages site ("Resource not accessible by
# integration"); pushing gh-pages needs only contents: write.

on:
  push:
    branches: [main]
    paths:
      - "apps/deaf-teacher-iep/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish app to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/deaf-teacher-iep
          publish_branch: gh-pages
          enable_jekyll: false
          # Keep other apps' folders (e.g. mindsight/) that live on gh-pages.
          keep_files: true
          commit_message: "Publish IEP Studio from"
