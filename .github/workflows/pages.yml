name: Deploy IEP Studio to GitHub Pages

# Publishes apps/deaf-teacher-iep as the GitHub Pages site.
# Pages requires the repository to be public (or a paid plan for private
# repos); until then this workflow will fail at the configure step, which
# is expected and harmless.

on:
  push:
    branches: [main]
    paths:
      - "apps/deaf-teacher-iep/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages (auto-enables on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/deaf-teacher-iep
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
