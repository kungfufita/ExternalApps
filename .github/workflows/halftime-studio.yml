name: HalfTime Studio tests

on:
  push:
    branches: [main]
    paths:
      - "apps/halftime-studio/**"
      - ".github/workflows/halftime-studio.yml"
  pull_request:
    paths:
      - "apps/halftime-studio/**"
      - ".github/workflows/halftime-studio.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/halftime-studio
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/halftime-studio/requirements*.txt
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 ffmpeg
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt PySide6
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: pytest -q
