<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mindsight</title>
<meta name="description" content="Blindfold-sight training platform: staged practice (light, colour, shape, symbol, word) with honest, device-blinded testing and statistics.">
<meta name="theme-color" content="#2f4b6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="app-header">
  <h1>Mindsight</h1>
  <p id="tagline">Blindfold-sight training · measured honestly</p>
</header>
<main id="main" tabindex="-1"></main>
<nav class="app-nav" aria-label="Main">
  <button data-view="home" aria-current="page"><span aria-hidden="true">◎</span>Today</button>
  <button data-view="train"><span aria-hidden="true">▶</span>Train</button>
  <button data-view="test"><span aria-hidden="true">✓</span>Test</button>
  <button data-view="progress"><span aria-hidden="true">↗</span>Progress</button>
  <button data-view="learn"><span aria-hidden="true">?</span>Learn</button>
</nav>
<div id="stage" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
